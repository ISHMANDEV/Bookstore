<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link href="Application.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <form>
            <h1>Job Application Form</h1>
            <label for="name">Full Name: </label>
            <input type="text" id="name"/>

            <label for="email">Email: </label>
            <input type="email" id="email">

            <label for="position">Position</label>
            <select id="position">
                <option selected disabled>Select a Position</option>
                <option>Developer</option>
                <option>Designer</option>
                <option>Manager</option>
            </select>

            <fieldset class="radio-group">
                <legend>Availability</legend>
                <input type="radio" id="full-time" name="availability" checked />
                <label for="full-time">Full Time</label>

                <input type="radio" id="part-time" name="availability" />
                <label for="part-time">Part Time</label>
            </fieldset>

            <label for="message">Why Do You Want This Job </label>
            <textarea id="message" placeholder="Write your motivation..." rows="5" cols="55"></textarea>

            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
